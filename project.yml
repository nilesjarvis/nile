name: Nile

options:
  bundleIdPrefix: com.niles
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  minimumXcodeGenVersion: 2.46.0

configs:
  Debug: debug
  LocalRelease: release
  Release: release

settings:
  base:
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: 0.1.0
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Nile:
    type: application
    platform: iOS
    sources:
      - path: Sources/Nile
      - path: Resources
    dependencies:
      - framework: Vendor/TextRenderer/NileTextRenderer.xcframework
        embed: false
    configFiles:
      Debug: Config/Debug.xcconfig
      LocalRelease: Config/LocalRelease.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: "$(inherited) -lc++ -lz"
        PRODUCT_BUNDLE_IDENTIFIER: com.niles.Nile
        PRODUCT_NAME: Nile
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          INFOPLIST_FILE: Config/Info-Debug.plist
        LocalRelease:
          INFOPLIST_FILE: Config/Info-LocalRelease.plist
        Release:
          INFOPLIST_FILE: Config/Info-Release.plist

  NileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/NileTests
    dependencies:
      - target: Nile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.niles.NileTests

  NileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/NileUITests
    dependencies:
      - target: Nile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.niles.NileUITests
        TEST_TARGET_NAME: Nile

schemes:
  Nile:
    build:
      targets:
        Nile: all
        NileTests:
          - test
        NileUITests:
          - test
    run:
      config: Debug
      environmentVariables:
        OS_ACTIVITY_MODE: disable
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: NileTests
          parallelizable: true
        - name: NileUITests
          parallelizable: false
    profile:
      config: LocalRelease
    analyze:
      config: Debug
    archive:
      config: Release
